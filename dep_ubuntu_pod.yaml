apiVersion: v1
kind: Pod
metadata:
  name: ubuntunew
  namespace: mslab
  labels:
    app: ubuntunew
spec:
  containers:
    - name: ubuntunew
      image: registry.lab.elarisystems.com/default/ubuntu
      env:
        - name: MESSAGE
          value: "Hello MSRIT !!!!      Shashwat"
      command: ["/bin/echo"]
      args: ["$(MESSAGE)"]
  restartPolicy: Never

